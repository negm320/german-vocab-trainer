<style>
*{box-sizing:border-box}
button,input,textarea,select{font-family:inherit;}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--font-body);}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px));}

/* header (large title) */
.bar{font-family:var(--font-title);font-size:28px;font-weight:700;color:var(--text);margin:2px 0 16px;}

/* card */
.card{padding:16px;position:relative;border-radius:var(--r-card);}

/* ── drill entrance (new card) ── */
@keyframes drillSlideIn{from{transform:translateX(18px);opacity:0}to{transform:translateX(0);opacity:1}}
.card.drill-enter #drillContent{animation:drillSlideIn .25s cubic-bezier(.25,.46,.45,.94) both;}

/* ── word chips stagger in ── */
@keyframes pieceIn{from{transform:translateY(6px);opacity:0}to{transform:translateY(0);opacity:1}}
.card.drill-enter .piece{animation:pieceIn .3s ease both;}
.card.drill-enter .piece:nth-child(1){animation-delay:.02s}
.card.drill-enter .piece:nth-child(2){animation-delay:.05s}
.card.drill-enter .piece:nth-child(3){animation-delay:.08s}
.card.drill-enter .piece:nth-child(4){animation-delay:.11s}
.card.drill-enter .piece:nth-child(5){animation-delay:.14s}
.card.drill-enter .piece:nth-child(6){animation-delay:.17s}
.card.drill-enter .piece:nth-child(7){animation-delay:.20s}
.card.drill-enter .piece:nth-child(8){animation-delay:.23s}
.card.drill-enter .piece:nth-child(9){animation-delay:.26s}
.card.drill-enter .piece:nth-child(10){animation-delay:.29s}
.card.drill-enter .piece:nth-child(n+11){animation-delay:.32s}

/* ── feedback line reveal ── */
@keyframes feedbackIn{from{transform:translateY(-4px);opacity:0}to{transform:translateY(0);opacity:1}}
#feedback:not(.hidden){animation:feedbackIn .25s ease both;}

/* divider */
.divider{border:none;border-top:1px solid var(--divider);margin:14px 0;}

/* inputs */
input,textarea{width:100%;padding:10px;border-radius:10px;font-size:16px;color:var(--text);}
.good-field{border-color:var(--good)!important;box-shadow:0 0 0 1px rgba(50,215,75,.45);}
.bad-field{border-color:var(--bad)!important;box-shadow:0 0 0 1px rgba(255,69,58,.45);}

/* states */
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
.good{color:var(--good)} .bad{color:var(--bad)}

/* flash overlay */
.flash-overlay{position:absolute;inset:0;border-radius:var(--r-card);pointer-events:none;opacity:0;}
@keyframes flashAnim{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.flash-good{background:var(--good-bg);border:1.5px solid rgba(50,215,75,.5);border-radius:var(--r-card);animation:flashAnim .65s ease both;}
.flash-bad{background:var(--bad-bg);border:1.5px solid rgba(255,69,58,.45);border-radius:var(--r-card);animation:flashAnim .65s ease both;}

/* shake */
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.input-shake{animation:shake .35s ease both;}

/* word pieces */
.piecesWrap{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0;}
.piece{padding:7px 13px;border-radius:10px;background:var(--btn);border:1.5px solid var(--border);font-size:15px;font-family:var(--font-body);color:var(--text);cursor:pointer;user-select:none;transition:opacity .2s ease,background .15s,transform .15s;}
.piece:active{transform:scale(.96);}
.piece.connector{background:rgba(10,132,255,0.12);border-color:rgba(10,132,255,0.4);color:var(--accent);}
.piece.used{opacity:0.3;text-decoration:line-through;}
@media (hover:hover){
  .piece:hover{background:var(--btn2);}
  .piece.connector:hover{background:rgba(10,132,255,0.2);}
}

/* loading — .loadingSpinner itself lives in ios-theme.css */
#loadingText{color:var(--muted);font-size:14px;padding:4px 0 16px;text-align:center;font-family:var(--font-chrome);}

/* undo-word: slides open under the textarea when there's something to undo */
.undoWrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease;}
.undoWrap.show{grid-template-rows:1fr;}
.undoWrap>div{overflow:hidden;display:flex;justify-content:flex-end;}
.undoWrap button{
  margin-top:8px;background:transparent;border:1px solid var(--border-soft);
  color:var(--muted);font-size:13px;padding:10px 16px;border-radius:999px;
  font-family:var(--font-chrome);
}
.undoWrap button:active{background:rgba(255,255,255,.06);}

/* mic states — .listening colors + ripple animation timing +
   @keyframes rippleOut now live in ios-theme.css (shared with
   chat.html/ausdruck.html instead of copy-pasted). */
#micBtn svg{width:26px;height:26px;stroke:var(--accent);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;transition:stroke .2s;}
.ripple{position:absolute;inset:-12px;border-radius:50%;border:2px solid var(--bad);opacity:0;pointer-events:none;}
#micStatus{font-size:12px;color:var(--muted);margin-top:6px;min-height:1.2em;font-family:var(--font-chrome);}
.input-interim{color:var(--muted)!important;}

/* Check/Next/mic control bar — flows below the card, NOT fixed (the floating
   dock is the only fixed bottom element now); renamed from .pill/.pillHalf
   to avoid colliding with ios-theme.css's badge-pill component. */
.bottomBar{display:flex;justify-content:center;margin-top:18px;}
.checkPill{position:relative;display:flex;align-items:center;width:100%;max-width:370px;height:54px;background:var(--card);border:1px solid var(--border);border-radius:27px;}
.checkPillHalf{flex:1;background:transparent;border:none;color:var(--text);font-size:15px;font-family:var(--font-chrome);cursor:pointer;height:100%;transition:background .15s;}
.checkPillHalf:first-child{border-radius:27px 0 0 27px;}
.checkPillHalf:last-child{border-radius:0 27px 27px 0;}
.checkPillHalf:active{background:rgba(255,255,255,.1);}
/* This split pill is a genuinely different interaction (Check and Next
   both persistently available, not one button swapping label) from the
   single-button primary CTA used elsewhere, so it keeps its own shape —
   but "Check" is still the primary action on this screen, and every
   other screen's primary action reads as accent-filled. Un-styled here,
   it was indistinguishable from a neutral surface. #btnCheck's own
   rules need an ID to outrank .checkPillHalf's active/hover states. */
#btnCheck{background:var(--accent);color:#fff;font-weight:600;}
#btnCheck:active{filter:brightness(.85);}
.micCircle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:80px;height:80px;border-radius:50%;background:var(--btn);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;transition:background .15s,border-color .15s,transform .15s;}
.micCircle:active{transform:translate(-50%,-50%) scale(.95);}
@media (hover:hover){
  .checkPillHalf:hover{background:rgba(255,255,255,.06);}
  #btnCheck:hover{filter:brightness(1.08);}
}

/* unnatural-sentence flag — same icon button + confirm flash as preps.html */
#btnFlagUnnatural{flex-shrink:0;}
#btnFlagUnnatural.flag-confirm{background:var(--bad-bg);border-color:rgba(255,69,58,.6);}
#btnFlagUnnatural.flag-confirm svg{stroke:var(--bad);}

/* word class borders (literal hues, not tied to theme tokens) */
.piece.acc-dat{border-color:#b8860b;}
.piece.personal-pronoun{border-color:#facc15;}
.piece.preposition{border-color:#c026d3;}
.piece.time-word{border-color:#22c55e;}
.piece.verb{background:var(--btn);border-color:var(--bad);color:#fff;}
</style>
<script src="demo-mode.js" defer></script>
</head>

<script>
const GEMINI_KEY_LS='top5k_gemini_key';

/* Plain-language copy for IOSSheet.classifyError()'s categories — keeps the
   raw fetch error (status code + truncated response body) off-screen. */
const ERR_MSG_EN={
  apikey:'Your API key looks invalid',
  quota:'Rate limit reached — please wait a moment',
  server:'The AI service is having trouble right now',
  network:'Network error — check your connection',
  unknown:'Something went wrong'
};

/* ── Gemini API helpers ── */
const GEMINI_MODEL='gemini-3.5-flash-lite';
// Gemini 3.x thinking is on by default (thinkingLevel, not the old
// thinkingBudget) and those hidden reasoning tokens count against
// maxOutputTokens — but this drill's maxOutputTokens is 4096 for a single
// sentence, so there's ample room to spend on reasoning. "low" buys a bit
// more deliberation (composing the German before translating it, choosing
// an idiomatic English gloss) than "minimal", and the added latency is
// hidden by the QUEUE_DEPTH=2 prefetch.
const GEMINI_THINKING_CONFIG={thinkingLevel:'low'};

function extractGeminiText(data){
  const parts=data?.candidates?.[0]?.content?.parts||[];
  return parts.filter(p=>!p.thought).map(p=>p.text||'').join('').trim();
}

// Parses only the first complete top-level JSON object starting at the
// first "{", ignoring any trailing content after it — some Gemini 3
// responses append stray extra data after a well-formed object, which
// breaks a naive indexOf('{')/lastIndexOf('}') slice.
function parseFirstJSON(raw){
  const start=raw.indexOf('{');
  if(start===-1) throw new Error(`no JSON object — raw: ${raw.slice(0,120)}`);
  let depth=0,inStr=false,esc=false;
  for(let i=start;i<raw.length;i++){
    const c=raw[i];
    if(inStr){
      if(esc) esc=false;
      else if(c==='\\') esc=true;
      else if(c==='"') inStr=false;
    }else{
      if(c==='"') inStr=true;
      else if(c==='{') depth++;
      else if(c==='}'){
        depth--;
        if(depth===0) return JSON.parse(raw.slice(start,i+1));
      }
    }
  }
  throw new Error(`unterminated JSON — raw: ${raw.slice(0,120)}`);
}

const CONNECTORS=new Set([
  'weil','dass','obwohl','wenn','als','damit','nachdem','bevor','während',
  'ob','bis','seit','seitdem','sobald','solange','sofern','falls','indem',
  'sodass','wohingegen','wobei','weshalb','weswegen','wozu','wie','zumal',
  'ehe','insofern','insoweit','soweit','obgleich','obschon','wiewohl',
  'je','desto','umso','beziehungsweise'
]);

const TIME_WORDS=new Set(['heute','jetzt','morgen','gestern','später','immer','nie','oft','manchmal','bald','noch','schon','dann','danach','vorher','früher','gerade','gleich','sofort','neulich','damals','einmal','zweimal','täglich','wöchentlich','monatlich','jährlich','stets','ständig','häufig','selten','meistens','normalerweise','gewöhnlich','übermorgen','vorgestern','zuletzt','zuerst','seitdem','inzwischen','mittlerweile','gleichzeitig','vorhin','nachher','bisher','demnächst','momentan','derzeit','zurzeit','früh','spät','abends','morgens','mittags','nachts','tagsüber','plötzlich','soeben','eben','bereits','erst','schließlich','letztendlich','zunächst','endlich','irgendwann','jemals','niemals','jederzeit','lange','kurz','montags','dienstags','mittwochs','donnerstags','freitags','samstags','sonntags','jahrelang','stundenlang','tagelang','wochenlang','monatelang','seither','heutzutage']);
const PREPOSITIONS=new Set(['an','auf','aus','außer','bei','bis','durch','entlang','für','gegen','gegenüber','hinter','in','innerhalb','mit','nach','neben','ohne','seit','statt','anstatt','trotz','über','um','unter','vor','wegen','während','zu','zwischen','ab','außerhalb','dank','gemäß','laut','mithilfe','seitens','unweit','zufolge','zugunsten','kraft','mittels','infolge','aufgrund','anhand','angesichts','bezüglich','hinsichtlich','ungeachtet','entgegen','entsprechend','mitsamt','nebst','samt']);
const NAMES=new Set(['anna','tom','maria','lukas','felix','emma','lena','max','sophie','paul','laura','jan','lisa','tim','julia','david','sarah','michael','nina','stefan','peter','claudia','markus','andrea','thomas','sabine','hans','monika','kevin','tobias']);
const PERSONAL_PRONOUNS=new Set(['ich','du','er','sie','es','wir','ihr','man']);
const ACC_DAT_PRONOUNS=new Set(['mich','dich','ihn','uns','euch','mir','dir','ihm','ihnen']);

function getWordClass(word,role){
  const w=word.toLowerCase();
  if(role==='verb'||role==='sep-prefix') return 'verb';
  if(CONNECTORS.has(w)) return 'connector';
  if(ACC_DAT_PRONOUNS.has(w)) return 'acc-dat';
  if(PERSONAL_PRONOUNS.has(w)) return 'personal-pronoun';
  if(NAMES.has(w)) return 'personal-pronoun';
  if(PREPOSITIONS.has(w)) return 'preposition';
  if(TIME_WORDS.has(w)) return 'time-word';
  return '';
}

let currentDrill=null;
let recognition=null;
let micActive=false;
let micBase='';
let snapFlags=[];

/* Broad everyday themes, not specific scenarios: a narrow English scenario
   ("a robot vacuum getting stuck") plus every other constraint below is what
   pushed the model into contrived sentences. The model picks the concrete
   moment itself. */
const THEMES=[
  'work and colleagues','the flat, neighbours and chores at home','shopping and errands',
  'food, cooking and eating out','friends and family','free time and hobbies',
  'getting around: bus, train, car, bike','travel and holidays','health and the doctor',
  'the weather and the seasons','phones, apps and the internet','money and bills',
  'school, courses and learning','the weekend and going out','appointments and plans'
];
/* Connectors a real person uses in speech, weighted by how often they come
   up. The old "ban the last three" rule kept knocking out weil/dass/wenn and
   steered the model to written-register ones (sofern, indem, sodass). */
const CONNECTOR_WEIGHTS={
  weil:5,dass:5,wenn:5,als:3,ob:3,obwohl:3,nachdem:2,bevor:2,
  damit:1.5,'während':1.5,bis:1.5,seit:1,sobald:1.5,falls:1
};
const FRONTABLE_CONNECTORS=['weil','obwohl','wenn','als','nachdem','bevor','falls','sobald','während','seit'];
const B2_CONNECTORS=Object.keys(CONNECTOR_WEIGHTS);
let lastThemeIndex=-1;
let lastInjectedIds=[];

// Rolling no-repeat list of the last few connectors actually used, fed back
// into each prompt so the model doesn't keep reaching for the same one or
// two — same push/format pattern as recentPairs/formatRecentPairs in
// preps.html, but persisted so the ban survives a reload.
const RECENT_CONN_CAP=1;
const RECENT_CONN_LS='grammar_recent_conn_v1';
let recentConnectors=[];
try{
  const raw=localStorage.getItem(RECENT_CONN_LS);
  const arr=raw?JSON.parse(raw):null;
  if(Array.isArray(arr)) recentConnectors=arr.slice(-RECENT_CONN_CAP);
}catch(e){}

function pushRecentConnector(conn){
  recentConnectors.push(conn.toLowerCase());
  if(recentConnectors.length>RECENT_CONN_CAP) recentConnectors.shift();
  try{ localStorage.setItem(RECENT_CONN_LS,JSON.stringify(recentConnectors)); }catch(e){}
}

function detectConnector(pairs){
  for(const {word} of pairs){
    const clean=word.replace(/[.,!?;:"""„"–—]/g,'').toLowerCase();
    if(B2_CONNECTORS.includes(clean)) return clean;
  }
  return null;
}

/* ── Vocabulary injection (top5k profile) ── */
function pickInjectionWord(profile,excludeIds){
  const r=Math.random();
  const primary=r<0.50?'weak':(r<0.85?'training':'random');
  const order=[primary,...['weak','training','random'].filter(b=>b!==primary)];
  for(const bucket of order){
    const pool=profile.words.filter(w=>w&&w.id!=null&&w.bucket===bucket&&!excludeIds.has(w.id));
    if(pool.length) return pool[Math.floor(Math.random()*pool.length)];
  }
  return null;
}

/* ── German phonetic matching (Kölner Phonetik) ── */
function kolnerPhonetik(word){
  let w=(word||'').toUpperCase();
  w=w.replace(/Ä/g,'A').replace(/Ö/g,'O').replace(/Ü/g,'U').replace(/[^A-Z]/g,'');
  const codes=[];
  for(let i=0;i<w.length;i++){
    const c=w[i], prev=w[i-1], next=w[i+1];
    let code=null;
    if('AEIOUJY'.includes(c)) code='0';
    else if(c==='H') code=null;
    else if(c==='B') code='1';
    else if(c==='P') code=(next==='H')?'3':'1';
    else if(c==='D'||c==='T') code=(next==='C'||next==='S'||next==='Z')?'8':'2';
    else if(c==='F'||c==='V'||c==='W') code='3';
    else if(c==='G'||c==='K'||c==='Q') code='4';
    else if(c==='X'){
      if(prev==='C'||prev==='K'||prev==='Q') code='8';
      else{ codes.push('4'); code='8'; }
    }
    else if(c==='L') code='5';
    else if(c==='M'||c==='N') code='6';
    else if(c==='R') code='7';
    else if(c==='S'||c==='Z') code='8';
    else if(c==='C'){
      if(i===0) code=(next&&'AHKLOQRUX'.includes(next))?'4':'8';
      else if(prev==='S'||prev==='Z') code='8';
      else code=(next&&'AHKOQUX'.includes(next))?'4':'8';
    }
    if(code!=null) codes.push(code);
  }
  const collapsed=[];
  for(const c of codes){ if(collapsed.length===0||collapsed[collapsed.length-1]!==c) collapsed.push(c); }
  return collapsed.filter((c,i)=>i===0||c!=='0').join('');
}

/* ── Snap-to-target: map recognized tokens onto the closed drill word set ── */
function nearestWord(token,candidates){
  const raw=token.replace(/[.,!?;:"""„"–—]/g,'');
  if(!raw||!candidates.length) return {word:token,snapped:false};
  const lower=raw.toLowerCase();
  for(const c of candidates) if(c.toLowerCase()===lower) return {word:c,snapped:false};
  const normTok=normWord(raw);
  for(const c of candidates) if(normWord(c)===normTok) return {word:c,snapped:true};
  const phonTok=kolnerPhonetik(raw);
  if(phonTok){
    for(const c of candidates) if(kolnerPhonetik(c)===phonTok) return {word:c,snapped:true};
  }
  let best=null,bestDist=Infinity;
  for(const c of candidates){
    const d=levenshtein(normTok,normWord(c));
    if(d<bestDist){ bestDist=d; best=c; }
  }
  if(best!==null&&bestDist<=3) return {word:best,snapped:true};
  return {word:token,snapped:false};
}

function snapTokens(text,candidates){
  const tokens=text.trim().split(/\s+/).filter(Boolean);
  const snapped=[];
  const words=tokens.map((tok,i)=>{
    const r=nearestWord(tok,candidates);
    if(r.snapped) snapped.push(i);
    return r.word;
  });
  return {text:words.join(' '),snapped};
}

/* ── Speech recognition ── */
function pickBestAlternative(result,candidates){
  const n=Math.min(result.length,4);
  let best=result[0].transcript,bestScore=-1;
  for(let k=0;k<n;k++){
    const transcript=result[k].transcript;
    const tokens=transcript.trim().split(/\s+/).filter(Boolean);
    let score=0;
    for(const tok of tokens){
      const clean=tok.replace(/[.,!?;:"""„"–—]/g,'').toLowerCase();
      if(candidates.some(c=>c.toLowerCase()===clean)) score+=2;
      else if(candidates.some(c=>normWord(c)===normWord(clean))) score+=1;
    }
    if(score>bestScore){ bestScore=score; best=transcript; }
  }
  return best;
}

{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    recognition=new SR();
    recognition.lang='de-DE';
    recognition.continuous=true;
    recognition.interimResults=true;
    recognition.maxAlternatives=4;

    recognition.onstart=()=>{
      micBase=document.getElementById('answerInput')?.value||'';
      snapFlags=[];
      setMicState('listening');
    };

    recognition.onresult=(e)=>{
      const candidates=currentDrill?._candidates||[];
      let interim='', final='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const transcript=pickBestAlternative(e.results[i],candidates);
        if(e.results[i].isFinal) final+=transcript;
        else interim+=transcript;
      }
      if(final) setInputFinal(final);
      else if(interim) setInputInterim(interim);
    };

    recognition.onerror=(e)=>{
      setMicState('idle');
      if(e.error!=='aborted') showMicMsg("Didn't catch that — try again");
    };

    recognition.onend=()=>{
      const inp=document.getElementById('answerInput');
      if(inp?.classList.contains('input-interim')){
        inp.classList.remove('input-interim');
      }
      setMicState('idle');
    };
  }else{
    document.getElementById('micBtn')?.classList.add('hidden');
  }
}

function setMicState(s){
  micActive=(s==='listening');
  const btn=document.getElementById('micBtn');
  const status=document.getElementById('micStatus');
  if(s==='listening'){
    btn?.classList.add('listening');
    if(status){ status.textContent='Listening…'; status.classList.remove('hidden'); }
  }else{
    btn?.classList.remove('listening');
    if(status) status.classList.add('hidden');
  }
}

function updateSnapPreview(){
  const status=document.getElementById('micStatus');
  const inp=document.getElementById('answerInput');
  if(!status||!inp||!micActive) return;
  if(!snapFlags.length){ status.textContent='Listening…'; return; }
  const tokens=inp.value.trim().split(/\s+/).filter(Boolean);
  const set=new Set(snapFlags);
  const html=tokens.map((t,i)=>
    set.has(i)
      ? `<u style="text-decoration-color:var(--accent);text-underline-offset:3px;">${escapeHTML(t)}</u>`
      : escapeHTML(t)
  ).join(' ');
  status.innerHTML=`<span class="muted" style="font-size:11px;">corrected: </span>${html}`;
  status.classList.remove('hidden');
}

/* One place that resizes the answer field AND keeps its shape in sync:
   pill at one line, rounded rectangle once it wraps (see .iosComposerInput
   in ios-theme.css). Called from every spot that changes the field's
   content — typing, tapping word pieces, and dictation. */
function sizeAnswerField(){
  const inp=document.getElementById('answerInput');
  if(!inp) return;
  inp.style.height='0px';
  const sh=inp.scrollHeight;
  inp.style.height=sh+'px';
  // Threshold from the field's own line-height + padding (this field uses
  // line-height:1.5, so a fixed 52px never tripped) — multiline past ~1.5
  // lines flips it from pill to rounded rectangle.
  const cs=getComputedStyle(inp);
  const lh=parseFloat(cs.lineHeight)||24;
  const padV=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
  inp.classList.toggle('multiline', sh > lh*1.5 + padV);
}

function setInputInterim(text){
  const inp=document.getElementById('answerInput');
  if(!inp) return;
  const {text:snappedText}=snapTokens(text,currentDrill?._candidates||[]);
  inp.value=micBase+(micBase&&!micBase.endsWith(' ')?' ':'')+snappedText;
  inp.classList.add('input-interim');
  sizeAnswerField();
  updatePieceStates();
}

function setInputFinal(text){
  const inp=document.getElementById('answerInput');
  if(!inp) return;
  const baseWordCount=micBase.trim()?micBase.trim().split(/\s+/).filter(Boolean).length:0;
  const {text:snappedText,snapped}=snapTokens(text,currentDrill?._candidates||[]);
  inp.value=micBase+(micBase&&!micBase.endsWith(' ')?' ':'')+snappedText;
  micBase=inp.value;
  snapFlags.push(...snapped.map(i=>baseWordCount+i));
  inp.classList.remove('input-interim');
  sizeAnswerField();
  updatePieceStates();
  updateSnapPreview();
}

/* ── Debug panel ── */
let debugVisible=false;
function appendDebugEntry(drill,pairs,hasWords){
  const flag=hasWords?'✓':'✗';
  const lines=[
    `${flag} words=${pairs.length}  [${new Date().toLocaleTimeString()}]`,
    `english: ${drill.english}`,
    `correct: ${drill.correct}`,
    drill._injectLine||'inject: none',
    ...(drill._meta?[drill._meta]:[]),
    `mapping:`
  ];
  pairs.forEach(({word,role},i)=>{
    const clean=word.replace(/[.,!?;:"""„"–—]/g,'');
    const cls=getWordClass(clean,role)||'(none)';
    lines.push(`  ${String(i).padStart(2)}  ${clean.padEnd(18)}role=${String(role).padEnd(12)}→ ${cls}`);
  });
  const entry=lines.join('\n');
  console.log('[grammar debug]\n'+entry);
  const panel=document.getElementById('debugPanel');
  if(!panel) return;
  const entries=panel.textContent?panel.textContent.split('\n\n'):[];
  entries.unshift(entry);
  if(entries.length>10) entries.length=10;
  panel.textContent=entries.join('\n\n');
}

function showMicMsg(msg){
  const status=document.getElementById('micStatus');
  if(!status) return;
  status.textContent=msg;
  status.classList.remove('hidden');
  setTimeout(()=>status.classList.add('hidden'),3000);
}

/* ── Prefetch queue ── */
const QUEUE_DEPTH=2;
let drillQueue=[];
let fetchesInFlight=0;

/* ── Unnatural-sentence flags ──
   The flag button stores the sentence here; the most recent ones go back into
   the prompt as examples of what NOT to produce, so the generator drifts
   toward the learner's own sense of "natural". */
const FLAGGED_LS='grammar_flagged_v1';
const FLAGGED_CAP=40, FLAGGED_IN_PROMPT=8;
function loadFlaggedDrills(){
  try{ const a=JSON.parse(localStorage.getItem(FLAGGED_LS)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; }
}
function flagCurrentDrill(){
  if(!currentDrill?.correct) return;
  const list=loadFlaggedDrills().filter(x=>x.german!==currentDrill.correct);
  list.push({german:currentDrill.correct,english:currentDrill.english,ts:Date.now()});
  while(list.length>FLAGGED_CAP) list.shift();
  try{ localStorage.setItem(FLAGGED_LS,JSON.stringify(list)); }catch(e){}
}

function pickWeighted(weights,exclude){
  const entries=Object.entries(weights).filter(([k])=>!exclude.includes(k));
  let r=Math.random()*entries.reduce((t,[,w])=>t+w,0);
  for(const [k,w] of entries){ r-=w; if(r<=0) return k; }
  return entries[entries.length-1][0];
}

/* Split the plain German sentence into chips and tag them from the model's
   verb/prefix lists. Punctuation stays attached to its word, as before.
   Separated prefixes are matched from the END (that's where they sit), so a
   preposition "an" earlier in the sentence isn't mistaken for one. */
function buildPairs(german,verbs,prefixes){
  const words=german.trim().split(/\s+/).filter(Boolean)
    .map(t=>t.endsWith("'")?t.slice(0,-1)+'e':t);
  const bare=w=>w.replace(/[.,!?;:"""„"–—]/g,'').toLowerCase();
  const roles=words.map(()=> 'other');
  const want=list=>{const m={};(list||[]).forEach(v=>{const k=bare(String(v||''));if(k)m[k]=(m[k]||0)+1;});return m;};
  const pre=want(prefixes);
  for(let i=words.length-1;i>=0;i--){ const k=bare(words[i]); if(pre[k]>0){ roles[i]='sep-prefix'; pre[k]--; } }
  const vb=want(verbs);
  for(let i=0;i<words.length;i++){ if(roles[i]!=='other') continue; const k=bare(words[i]); if(vb[k]>0){ roles[i]='verb'; vb[k]--; } }
  return words.map((w,i)=>({word:w,role:roles[i]}));
}

/* Generation model. Sentence quality is a "does this sound native" judgement,
   which is exactly what the smallest models are worst at, so this screen uses
   a full Flash model. If that model isn't available on this key (404/400/403)
   or is rate-limited (429 — free tiers give Flash far fewer requests than
   Flash-Lite), it falls back to the lite model the other screens use. */
const DRILL_MODEL='gemini-3.8-flash';
const DRILL_FALLBACK_MODEL=GEMINI_MODEL;
let drillModelOffUntil=0; // 429 → lite for 10 min; missing model → lite for the session

async function fetchDrill(){
  if(window.IOSDemo?.on) return IOSDemo.grammarDrill();
  const key=localStorage.getItem(GEMINI_KEY_LS);
  if(!key) throw new Error('no key');

  let profile=null;
  try{
    const raw=localStorage.getItem('top5k_profile_v1');
    if(raw){
      const p=JSON.parse(raw);
      if(p&&p.v===1&&Array.isArray(p.words)&&p.words.length>0) profile=p;
    }
  }catch(e){}

  // One focus per drill: either a vocabulary word (60%) or a set connector.
  // Stacking topic + subject + connector + clause order + two words is what
  // made the old sentences contrived.
  let word=null;
  if(profile&&Math.random()<0.60) word=pickInjectionWord(profile,new Set(lastInjectedIds));
  lastInjectedIds=word?[word.id]:[];

  // Picked here, not after the reply, so two prefetches running at once
  // don't both land on the same connector.
  const connector=pickWeighted(CONNECTOR_WEIGHTS,recentConnectors);
  pushRecentConnector(connector);
  const front=FRONTABLE_CONNECTORS.includes(connector)&&Math.random()<0.4;

  let themeIdx;
  do{ themeIdx=Math.floor(Math.random()*THEMES.length); }while(themeIdx===lastThemeIndex&&THEMES.length>1);
  lastThemeIndex=themeIdx;
  const theme=THEMES[themeIdx];

  const focusLine=word
    ? `- Vocabulary word: "${word.german}" (English: "${word.english}"). This is the one thing the sentence must contain, in whatever form the sentence needs (any tense, case, plural). Build the sentence around a situation where a native speaker would genuinely use this word. Suggested connector: "${connector}", but use any other common spoken connector if it fits the word more naturally. If the word itself is a connector or linking word, let it be the connector. Only if the word truly cannot appear in a natural everyday two-clause sentence, leave it out and set "usedWord" to false.`
    : `- Connector: use "${connector}" to join the two clauses. Pick a situation where a real person would naturally say "${connector}" — not just any situation where it is grammatical.`;
  const orderLine=front
    ? `- If it sounds natural, put the "${connector}"-clause FIRST; the main clause then starts with its finite verb ("Weil es regnet, BLEIBE ich zu Hause"). If fronting would sound odd here, put the main clause first.`
    : `- Clause order: whichever order a native speaker would use here.`;

  const flagged=loadFlaggedDrills().slice(-FLAGGED_IN_PROMPT);
  const flaggedLine=flagged.length
    ? `\nThe learner rejected these earlier sentences as unnatural or silly. Do not produce anything with the same problems:\n${flagged.map(f=>`- ${f.german}`).join('\n')}\n`
    : '';

  const prompt=`You write sentences for a German word-order drill. The learner sees the English, gets the German words shuffled, and rebuilds the German sentence. The sentence is only useful if it is something a real German speaker would actually say in everyday life — natural and plausible beats clever or complete every time.

Write THREE different candidate sentences, then pick the one that sounds most like real spoken German.

Each candidate:
- Two clauses joined by a subordinating connector, usually 8–16 words.
- Everyday theme, loosely: ${theme}. You choose the concrete moment; if the vocabulary word needs a different theme, change the theme.
${focusLine}
${orderLine}
- Subject: whoever fits naturally (ich, du, wir, er/sie, a first name, a colleague…).
- Spoken register: ordinary past events use Perfekt ("hat gekauft", "ist gekommen"); Präteritum only for sein, haben and modal verbs (war, hatte, konnte, musste, wollte). No Futur with "werden" (use present tense for the future, as people do). Konjunktiv II is fine in everyday uses (hätte, wäre, würde, könnte, "wenn ich Zeit hätte"). No Konjunktiv I, no bookish or literary words, no idioms.
- Full written forms: "habe" not "hab'", "geht es" not "geht's", "eine" not "'ne".
- A believable detail beats a generic one, but nothing dramatic, absurd or overly specific. Would a friend actually text or say this? If not, discard it.

English: translate the chosen German into natural English with the same clauses in the same order and the same meaning, but normal English word order inside each clause (never German verb-final order). Perfekt → English simple past unless English really needs "have done". "man" → "you"/"we", "um … zu" → "to".
${flaggedLine}
Return JSON only, no markdown:
{"candidates":[{"german":"…","english":"…"},{"german":"…","english":"…"},{"german":"…","english":"…"}],
 "pick":0,
 "usedWord":true,
 "verbs":["every verb form in the PICKED German sentence, exactly as written: finite verbs, infinitives, participles"],
 "prefixes":["separated verb prefixes in the picked sentence, e.g. \\"an\\" in \\"Ich rufe dich an\\"; empty if none"]}

Example of one good candidate: {"german":"Ich rufe dich an, sobald ich angekommen bin.","english":"I'll call you as soon as I've arrived."} with verbs ["rufe","angekommen","bin"] and prefixes ["an"].`;

  const body=JSON.stringify({
    contents:[{parts:[{text:prompt}]}],
    generationConfig:{temperature:0.9,maxOutputTokens:4096,responseMimeType:"application/json",thinkingConfig:GEMINI_THINKING_CONFIG}
  });

  const retryDelays=[800,1600,3200];
  let lastErr=new Error('unknown error');
  for(let attempt=0;attempt<3;attempt++){
    if(attempt>0) await new Promise(r=>setTimeout(r,retryDelays[attempt-1]));
    const onFallback=Date.now()<drillModelOffUntil;
    const model=onFallback?DRILL_FALLBACK_MODEL:DRILL_MODEL;
    const url=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
    let shouldRetry=false;
    try{
      const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body});
      if([400,403,404,429].includes(res.status)&&!onFallback&&DRILL_MODEL!==DRILL_FALLBACK_MODEL){
        console.warn(`[grammar] ${DRILL_MODEL} unavailable (HTTP ${res.status}) — falling back to ${DRILL_FALLBACK_MODEL}`);
        drillModelOffUntil=Date.now()+(res.status===429?10*60*1000:Infinity);
        shouldRetry=true;
      }else if(res.status===429||res.status>=500){
        lastErr=new Error(`API ${res.status}`);
        shouldRetry=true;
      }else if(!res.ok){
        const errBody=await res.text().catch(()=>'');
        throw new Error(`API ${res.status}: ${errBody.slice(0,200)}`);
      }else{
        const data=await res.json();
        const raw=extractGeminiText(data);
        const out=parseFirstJSON(raw);
        const cands=Array.isArray(out.candidates)?out.candidates.filter(c=>c&&typeof c.german==='string'&&c.german.trim()&&typeof c.english==='string'&&c.english.trim()):[];
        if(!cands.length) throw new Error(`bad shape — raw: ${raw.slice(0,100)}`);
        const pickIdx=Number.isInteger(out.pick)&&out.pick>=0&&out.pick<cands.length?out.pick:0;
        const chosen=cands[pickIdx];
        const pairs=buildPairs(chosen.german,out.verbs,out.prefixes);
        const drill={
          english:chosen.english.trim(),
          correct:pairs.map(p=>p.word).join(' '),
          _hasWords:true,
          _injectLine:word?`inject: ${word.german} (${word.bucket})${out.usedWord===false?' — skipped by model':''}`:'inject: none',
          _meta:`model=${model} connector=${connector}${front?' (front)':''} theme=${theme} pick=${pickIdx}\n  others: ${cands.filter((_,i)=>i!==pickIdx).map(c=>c.german).join(' | ')}`
        };
        const used=detectConnector(pairs);
        if(used&&used!==connector) pushRecentConnector(used);
        for(let i=pairs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pairs[i],pairs[j]]=[pairs[j],pairs[i]];}
        drill.pieces=pairs;
        return drill;
      }
    }catch(e){
      lastErr=e;
      if(e instanceof TypeError) shouldRetry=true;
    }
    if(!shouldRetry) break;
  }
  throw lastErr;
}

function refillQueue(){
  while(drillQueue.length+fetchesInFlight<QUEUE_DEPTH){
    fetchesInFlight++;
    fetchDrill()
      .then(drill=>{drillQueue.push(drill);fetchesInFlight--;})
      .catch(err=>{console.error('[grammar prefetch]',err);fetchesInFlight--;});
  }
}

function presentDrill(drill){
  if(micActive&&recognition) recognition.stop();
  drill._candidates=drill.pieces.map(p=>p.word.replace(/[.,!?;:"""„"–—]/g,'')).filter(Boolean);
  currentDrill=drill;
  appendDebugEntry(drill,drill.pieces,drill._hasWords);
  renderDrill(drill);
  refillQueue();
}

/* ── Generate drill (public) ── */
async function generateDrill(){
  const key=localStorage.getItem(GEMINI_KEY_LS);
  if(!key && !window.IOSDemo?.on) return;

  if(drillQueue.length>0){
    presentDrill(drillQueue.shift());
    return;
  }

  const card=document.getElementById('drillCard');
  const loadingSpinner=document.getElementById('loadingSpinner');
  const loadingText=document.getElementById('loadingText');
  const drillContent=document.getElementById('drillContent');
  const feedback=document.getElementById('feedback');

  loadingSpinner.classList.remove('hidden');
  loadingText.textContent='Generating drill…';
  loadingText.classList.remove('hidden','errorText');
  drillContent.classList.add('hidden');
  feedback?.classList.add('hidden');

  try{
    const drill=await fetchDrill();
    presentDrill(drill);
  }catch(e){
    console.error('[grammar drill]',e);
    loadingSpinner.classList.add('hidden');
    loadingText.textContent=`${ERR_MSG_EN[IOSSheet.classifyError(e)]} — tap Next to retry.`;
    loadingText.classList.add('errorText');
    loadingText.style.wordBreak='break-word';
  }
}

/* ── Render drill ── */
function renderDrill(drill){
  const card=document.getElementById('drillCard');
  const loadingSpinner=document.getElementById('loadingSpinner');
  const loadingText=document.getElementById('loadingText');
  const drillContent=document.getElementById('drillContent');
  const inp=document.getElementById('answerInput');
  const feedback=document.getElementById('feedback');
  const piecesWrap=document.getElementById('piecesWrap');
  const englishText=document.getElementById('englishText');

  loadingSpinner.classList.add('hidden');
  loadingText.classList.add('hidden');
  drillContent.classList.remove('hidden');

  englishText.textContent=drill.english;
  inp.value='';
  micBase='';
  sizeAnswerField();
  inp.classList.remove('good-field','bad-field','input-shake');
  feedback.classList.add('hidden');
  feedback.innerHTML='';

  document.getElementById('undoWrap')?.classList.remove('show');
  piecesWrap.innerHTML='';

  card.classList.remove('drill-enter');
  void card.offsetWidth;
  card.classList.add('drill-enter');
  clearTimeout(renderDrill._enterTimer);
  renderDrill._enterTimer=setTimeout(()=>card.classList.remove('drill-enter'),700);
  drill.pieces.forEach(({word,role})=>{
    const btn=document.createElement('button');
    const clean=word.replace(/[.,!?;:"""„"–—]/g,'');
    const wc=getWordClass(clean,role);
    btn.className='piece'+(wc?' '+wc:'');
    btn.textContent=clean;
    let lock=0;
    btn.addEventListener('pointerdown',(e)=>{
      e.preventDefault();
      const now=Date.now(); if(now-lock<400) return; lock=now;
      const cur=inp.value;
      inp.value=cur+(cur&&!cur.endsWith(' ')?' ':'')+clean;
      sizeAnswerField();
      updatePieceStates();
    },{passive:false});
    btn.addEventListener('mousedown',(e)=>e.preventDefault());
    piecesWrap.appendChild(btn);
  });

  setTimeout(()=>inp.focus(),0);
}

/* ── Helpers ── */
function escapeHTML(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function triggerFlash(type){
  const el=document.getElementById('flashOverlay');
  if(!el) return;
  el.className='flash-overlay';
  void el.offsetWidth;
  el.className='flash-overlay flash-'+type;
  setTimeout(()=>{ el.className='flash-overlay'; },700);
}

/* ── Local sentence evaluator ── */
function stripPunct(s){
  return (s||'').replace(/[.,!?;:"""„"()[\]{}–—]/g,'').replace(/\s+/g,' ').trim();
}
function normWord(w){
  return w.toLowerCase()
    .replace(/['']/g,"'")
    .replaceAll('ue','ü').replaceAll('oe','ö').replaceAll('ae','ä').replaceAll('ss','ß');
}
function levenshtein(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i?j?0:i:j));
  for(let i=1;i<=m;i++)
    for(let j=1;j<=n;j++)
      dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
function wordsMatch(u,c){
  const un=normWord(u),cn=normWord(c);
  if(un===cn) return {match:true,typo:false};
  const pu=kolnerPhonetik(un),pc=kolnerPhonetik(cn);
  if(pu&&pu===pc) return {match:true,typo:true};
  if(levenshtein(un,cn)<=2) return {match:true,typo:true};
  return {match:false,typo:false};
}
/* Order-preserving alignment (edit-distance DP) between user words (uw) and
   correct words (cw): finds the best-scoring set of matched pairs while
   allowing correct words to be dropped and user words to be extra. */
function alignWords(uw,cw){
  const m=uw.length,n=cw.length;
  const score=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      const diag=score[i-1][j-1]+(wordsMatch(uw[i-1],cw[j-1]).match?1:0);
      score[i][j]=Math.max(diag,score[i-1][j],score[i][j-1]);
    }
  }
  let i=m,j=n,extraCount=0;
  const cwMatched=new Array(n).fill(false);
  const cwTypo=new Array(n).fill(false);
  while(i>0&&j>0){
    const wm=wordsMatch(uw[i-1],cw[j-1]);
    if(wm.match&&score[i][j]===score[i-1][j-1]+1){
      cwMatched[j-1]=true; cwTypo[j-1]=wm.typo;
      i--; j--;
    }else if(score[i][j]===score[i-1][j]){
      extraCount++; i--;
    }else{
      j--;
    }
  }
  extraCount+=i;
  const droppedIdx=[],typoIdx=[];
  for(let k=0;k<n;k++){
    if(!cwMatched[k]) droppedIdx.push(k);
    else if(cwTypo[k]) typoIdx.push(k);
  }
  return {droppedIdx,typoIdx,extraCount};
}
function evaluateAnswer(userRaw,correctRaw){
  const user=stripPunct(userRaw).toLowerCase();
  const correct=stripPunct(correctRaw).toLowerCase();
  if(user===correct) return {verdict:'CORRECT',typoIndices:[]};
  const uw=user.split(/\s+/).filter(Boolean);
  const cw=correct.split(/\s+/).filter(Boolean);
  const {droppedIdx,typoIdx,extraCount}=alignWords(uw,cw);
  if(extraCount>0) return {verdict:'WRONG',typoIndices:[]};
  if(!droppedIdx.length&&!typoIdx.length) return {verdict:'CORRECT',typoIndices:[]};
  const droppedOk=droppedIdx.length<=1&&droppedIdx.every(idx=>cw[idx].length<=3);
  if(droppedOk) return {verdict:'TYPO',typoIndices:[...typoIdx,...droppedIdx]};
  return {verdict:'WRONG',typoIndices:[]};
}
function buildCorrectHTML(correctRaw,typoIndices){
  const typoSet=new Set(typoIndices);
  return correctRaw.split(/\s+/).map((token,i)=>
    typoSet.has(i)
      ? `<u style="text-decoration-color:var(--accent);text-underline-offset:3px;">${escapeHTML(token)}</u>`
      : escapeHTML(token)
  ).join(' ');
}

/* ── Sync piece used-state with textarea content ── */
function updatePieceStates(){
  const inp=document.getElementById('answerInput');
  const piecesWrap=document.getElementById('piecesWrap');
  if(!inp||!piecesWrap||!currentDrill) return;

  const typedWords=inp.value.trim().split(/\s+/).filter(Boolean)
    .map(w=>w.replace(/[.,!?;:"""„"–—]/g,'').toLowerCase());
  const remaining={};
  typedWords.forEach(w=>{remaining[w]=(remaining[w]||0)+1;});

  const consumed={};
  piecesWrap.querySelectorAll('.piece').forEach(btn=>{
    const word=btn.textContent.trim().toLowerCase();
    consumed[word]=consumed[word]||0;
    if(consumed[word]<(remaining[word]||0)){
      btn.classList.add('used');
      consumed[word]++;
    }else{
      btn.classList.remove('used');
    }
  });
  const undoWrap=document.getElementById('undoWrap');
  if(undoWrap) undoWrap.classList.toggle('show',!!inp.value.trim());
}

/* ── Check answer ── */
function checkAnswer(){
  if(!currentDrill) return;
  const inp=document.getElementById('answerInput');
  const feedback=document.getElementById('feedback');

  inp.classList.remove('good-field','bad-field');
  document.getElementById('undoWrap')?.classList.remove('show');

  const {verdict,typoIndices}=evaluateAnswer(inp.value,currentDrill.correct);

  if(verdict==='CORRECT'){
    inp.classList.add('good-field');
    triggerFlash('good');
    feedback.classList.add('hidden');
    setTimeout(()=>generateDrill(),800);
  }else if(verdict==='TYPO'){
    inp.classList.add('good-field');
    triggerFlash('good');
    feedback.innerHTML=`<span style="color:var(--muted);font-size:13px;">Typo — close enough:</span><br><strong>${buildCorrectHTML(currentDrill.correct,typoIndices)}</strong>`;
    feedback.classList.remove('hidden');
    setTimeout(()=>generateDrill(),2000);
  }else{
    inp.classList.add('bad-field');
    triggerFlash('bad');
    inp.classList.remove('input-shake');
    void inp.offsetWidth;
    inp.classList.add('input-shake');
    setTimeout(()=>inp.classList.remove('input-shake'),400);
    feedback.innerHTML=`<span class="muted">Correct: </span><strong>${escapeHTML(currentDrill.correct)}</strong>`;
    feedback.classList.remove('hidden');
  }
}

  }
  generateDrill();
}
