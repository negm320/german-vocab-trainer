<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Chat – Szene</title>
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<style>
*{box-sizing:border-box;margin:0;padding:0;}
button,input,textarea,select{font-family:inherit;}
html{height:100%;}
body{height:100%;background:var(--bg);color:var(--text);font:15px/1.5 'Lora',Georgia,serif;display:flex;flex-direction:column;overflow:hidden;}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}

/* ── Scene slate — replaces a contact-card header + a squeezed situation
   line with one unit that leads with the invented situation (the actual
   generated content, different every scene) and folds the character into
   a "cast credit" beneath it, like a scene heading in a script. ── */
/* Translucent glass slate (was a solid --card slab with a hard 1px
   divider — the one heavy, flat panel while the rest of the app went to
   floating glass). Sits absolute over the transcript so messages scroll up
   and blur beneath it; a soft scroll-edge fade replaces the divider. */
.sceneSlate{
  position:absolute;top:0;left:0;right:0;z-index:5;
  padding:14px 16px 15px;
  background:linear-gradient(180deg, rgba(28,28,30,0.80), rgba(28,28,30,0.62));
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
}
.sceneSlate::after{
  content:'';position:absolute;left:0;right:0;top:100%;height:24px;
  background:linear-gradient(180deg, rgba(0,0,0,0.20), rgba(0,0,0,0));
  pointer-events:none;
}
/* Chrome buttons go ghost in the slate — the filled grey circles read as
   heavy here; bare glyphs (lit on press) keep the italic situation line
   the clear hero. */
.sceneSlate .iosIconBtn{background:transparent;border-color:transparent;}
.sceneSlate .iosIconBtn:active{background:rgba(120,120,128,0.24);}
@media (hover:hover){ .sceneSlate .iosIconBtn:hover{background:rgba(120,120,128,0.18);} }
.slateTop{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.slateEyebrow{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);font-family:var(--font-chrome);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slateLabel{font-weight:600;color:var(--muted2);flex-shrink:0;}
.slateDot{width:6px;height:6px;border-radius:50%;background:var(--good);flex-shrink:0;transition:background .25s;}
#statusText{overflow:hidden;text-overflow:ellipsis;}
.hActions{display:flex;gap:8px;flex-shrink:0;}

.slateSituation{font-family:'Lora',Georgia,serif;font-style:italic;font-weight:500;font-size:17px;line-height:1.4;color:var(--text);margin:9px 0 8px;}

.slateCast{display:flex;align-items:baseline;gap:7px;font-size:12.5px;line-height:1.4;}
.castDot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-bottom:1px;background:var(--accent);}
.castLine{min-width:0;}
.castLine strong{font-weight:700;color:var(--text);font-family:var(--font-chrome);}

/* ── Messages area ── */
/* overflow:visible so the floating pill's drop shadow isn't clipped; the
   inner .messages element is its own overflow-y:auto scroller and clips
   the bubbles itself. min-height:0 is essential: a flex item defaults to
   min-height:auto (won't shrink below content), so with overflow:visible
   the wrapper would grow to the full message height and push the absolute
   pill off the bottom of the screen — min-height:0 lets flex clamp it to
   the available space instead. */
.messagesWrap{flex:1;min-height:0;overflow:visible;position:relative;}
/* padding-top reserves the slate's live height (set via ResizeObserver)
   so the first bubble starts below it but can scroll up underneath. */
.messages{height:100%;overflow-y:auto;padding:var(--slate-pad,104px) 12px 0;}
.messagesInner{display:flex;flex-direction:column;gap:2px;padding-bottom:var(--msg-bottom-pad,96px);}

.ts{text-align:center;color:var(--muted);font-size:11px;margin:8px 0 4px;flex-shrink:0;font-family:var(--font-chrome);}
.sysRow{padding:14px 0;display:flex;flex-direction:column;align-items:center;gap:6px;}
.sysRow .loadingSpinner{margin-bottom:0;}

/* ── Bubble rows ──
   The AI avatar/bubble accent color is set inline per-message (JS: castHue())
   from a hash of the character's name, so each invented character keeps one
   consistent identity color through the whole scene — echoing the cast-dot
   in the scene slate above. */
.bRow{display:flex;align-items:flex-end;gap:7px;}
.bRow.ai{justify-content:flex-start;}
.bRow.user{justify-content:flex-end;}
.bAvatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;font-family:var(--font-chrome);}
.bubble{max-width:74%;padding:9px 13px;font-size:15px;line-height:1.55;word-break:break-word;}
.bRow.ai .bubble{background:var(--input);color:var(--text);border-radius:16px 16px 16px 3px;border-left:2.5px solid var(--accent);}
.bRow.user .bubble{background:var(--accent);color:#fff;border-radius:16px 16px 3px 16px;}
.errSpan{cursor:pointer;padding-bottom:1px;}

/* ── Correction/naturalness legend ──
   Corrections and naturalness notes previously differed only by underline
   color (solid red vs solid blue) — not colorblind-safe, and undiscoverable
   without tapping a span. Naturalness now gets a dashed underline instead of
   solid, and this legend teaches the convention once, the first time
   feedback lands in a scene. */
.fbLegend{display:flex;justify-content:center;gap:16px;margin:8px 0 2px;font-size:11px;color:var(--muted2);font-family:var(--font-chrome);}
.fbLegend-item{display:flex;align-items:center;gap:5px;}
.fbLegend-item::before{content:'';display:inline-block;width:14px;height:0;border-bottom:2px solid;}
.fbLegend-corr::before{border-bottom-style:solid;border-color:var(--bad);}
.fbLegend-nat::before{border-bottom-style:dashed;border-color:var(--warn);}

/* ── The morphing pill ────────────────────────────────────────────────
   ONE floating Liquid-Glass capsule owns the bottom slot. On the other
   four screens it's the 5-tab dock. Here it defaults to the chat
   composer and *morphs* into that same 5-tab dock when the opener is
   tapped — so there are never two floating bars stacked, and when the
   keyboard is up it's only the composer riding it (the dock literally
   doesn't exist in that moment, because it's the same pill). That makes
   the old dock-over-keyboard collision structurally impossible, and lets
   us delete the heavy frosted gradient the composer used to sit in.
   Reuses the shared .iosDock shell (position/glass/view-transition-name
   from ios-theme.css) so navigating in/out of chat morphs dock<->composer
   for free via the cross-document view transition. */
/* position:absolute (overriding .iosDock's fixed) keeps the pill in the
   same stacking context as the scrolling messages, which is what lets its
   backdrop-filter blur them. .messagesWrap is the positioned ancestor;
   bottom sits at the viewport bottom because the wrapper fills to there. */
#chatPill{position:absolute;min-height:58px;overflow:hidden;transition:border-radius .2s ease;}
#chatPill .iosDock-glass,#chatPill .iosDock-highlight{border-radius:inherit;}
/* When the composer wraps to multiple lines the pill grows tall, and a
   full-pill radius on a tall capsule looks wrong (a giant lozenge) — so it
   flattens to a rounded rectangle, matching the text field inside it. */
#chatPill.expanded{border-radius:24px;}
/* ...but opening the nav dock always shows the compact dock, even if the
   composer still holds several lines of text: the pill collapses back to
   its one-line height (the taller composer content clips off the top as
   .pillFace's max-height animates down) and returns to a full pill.
   navmode wins over .expanded because it's declared after it. */
#chatPill.navmode{border-radius:var(--r-dock);}
#chatPill.navmode .pillFace{max-height:58px;}

/* Composer face defines the pill's height (so it grows with a multi-line
   textarea); the nav face is an absolute overlay that fades in over it.
   max-height gives the collapse something numeric to animate between. */
.pillFace{position:relative;z-index:1;max-height:260px;overflow:hidden;transition:max-height .32s ease;}
.composerRow,.sceneEndRow{display:flex;min-height:58px;gap:8px;}
.composerRow.hidden,.sceneEndRow.hidden{display:none;}
/* Icons anchor to the BOTTOM of the row (align-items:flex-end), so as the
   textarea grows upward the opener + mic stay put at the bottom edge next
   to the newest line instead of drifting to the vertical centre of a tall
   field. Symmetric 9px padding keeps them balanced at one line. */
.composerRow{align-items:flex-end;padding:9px;}
.sceneEndRow{align-items:center;justify-content:center;padding:0 9px;gap:12px;}

.pillOpener,#micBtn{position:relative;flex-shrink:0;width:40px;height:40px;border-radius:50%;background:var(--btn);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s,border-color .2s;}
.pillOpener svg{width:20px;height:20px;stroke:var(--accent);stroke-width:2;fill:none;}
#micBtn svg{width:20px;height:20px;stroke:var(--accent);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;transition:stroke .2s;}

/* Pill shape (var(--r-pill)) lives in ios-theme.css (.iosComposerInput).
   The field collapses toward the opener during the morph, so its
   transform-origin is the left edge. */
#chatInput{flex:1;min-width:0;min-height:40px;max-height:120px;padding:9px 15px;color:var(--text);font-size:15px;line-height:1.4;outline:none;resize:none;overflow-y:auto;transform-origin:left center;}
#chatInput::placeholder{color:var(--muted);}
#chatInput.interim{color:var(--muted2);font-style:italic;}
.ripple{position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--bad);opacity:0;pointer-events:none;}
body.kb-open .ripple{display:none;}

#btnNextScene{padding:11px 24px;background:var(--accent);border:1px solid var(--accent);color:#fff;font-weight:600;font-size:15px;border-radius:999px;font-family:var(--font-chrome);transition:filter .15s;}
#btnNextScene:active{filter:brightness(.92);}
@media (hover:hover){ #btnNextScene:hover{filter:brightness(1.08);} }

/* Nav face: the 5 tabs, cascaded in by the morph (JS sets per-item
   opacity + translateX). Starts hidden so it doesn't flash before JS. */
.pillNav{position:absolute;inset:0;z-index:2;display:flex;align-items:center;padding:6px 8px;pointer-events:none;}
.pillNav .iosDock-item{opacity:0;}

/* ── Correction / naturalness tooltip ── */
#errTooltip{position:fixed;max-width:260px;background:var(--card);border:1px solid var(--border-soft);border-left:3px solid var(--tip-color,var(--accent));border-radius:10px;padding:11px 13px 12px;font-size:13px;line-height:1.5;font-family:var(--font-chrome);box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:5000;display:none;opacity:0;transform:translateY(-4px) scale(.97);transition:opacity .12s ease,transform .12s ease;}
#errTooltip.show{display:block;}
#errTooltip.visible{opacity:1;transform:translateY(0) scale(1);}
#errTooltip::before{content:'';position:absolute;top:-6px;left:var(--tip-arrow,24px);width:10px;height:10px;background:var(--card);border-left:1px solid var(--border-soft);border-top:1px solid var(--border-soft);transform:rotate(45deg);}
#errTooltip .corrLine{font-weight:600;margin-bottom:4px;}

/* ── Settings sheet — .menuPanel/.menuSection/.iosSheet-label/.iosSegment
   now live in ios-theme.css (shared with top5k.html instead of
   copy-pasted). ── */
#turnCapInput{width:100%;padding:11px;border-radius:10px;color:var(--text);font-size:15px;}
</style>
</head>
<body>
<script>(function(){var t=localStorage.getItem('top5k_active_tab');if(t==='vocab')location.replace('top5k.html');else if(t==='grammar')location.replace('grammar.html');else if(t==='preps')location.replace('preps.html');else if(t==='ausdruck')location.replace('ausdruck.html');})();</script>

<!-- Messages + floating chrome. The scene slate (top) and composer pill
     (bottom) both live INSIDE .messagesWrap as absolute glass layers, so
     their backdrop-filters can sample the transcript scrolling under them —
     a position:fixed element's backdrop can't reach into the messages'
     composited scroll layer. -->
<div class="messagesWrap">

<!-- Scene slate: situation first (the hero line), character folded into a
     cast credit beneath it — a scene heading, not a contact card. A
     translucent glass layer the transcript scrolls up under. -->
<div class="sceneSlate">
  <div class="slateTop">
    <div class="slateEyebrow">
      <span class="slateLabel">Szene</span>
      <span class="slateDot" id="statusDot"></span>
      <span id="statusText">in der Szene</span>
    </div>
    <div class="hActions">
      <button id="btnEndScene" class="iosIconBtn hidden" title="Szene beenden" aria-label="Szene beenden">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
      </button>
      <button id="btnSettings" class="iosIconBtn" title="Einstellungen" aria-label="Einstellungen">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82A1.65 1.65 0 003 13.09H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>
      </button>
    </div>
  </div>
  <div class="slateSituation" id="scenarioText">Szene wird geladen…</div>
  <div class="slateCast hidden" id="slateCast">
    <span class="castDot" id="castDot"></span>
    <span class="castLine"><strong id="hName"></strong><span id="castMeta" class="muted"></span></span>
  </div>
</div>

  <div class="messages" id="messagesArea">
    <div class="messagesInner" id="messagesInner"></div>
  </div>

  <!-- The morphing pill lives INSIDE .messagesWrap (position:absolute, not a
       fixed top-level element) so its backdrop-filter can actually sample
       the scrolling bubbles behind it. A position:fixed element's backdrop
       can't reach into the messages' own composited scroll layer, so the
       blur silently no-ops over them (the symptom: sharp text under glass). -->
  <nav class="iosDock" id="chatPill" aria-label="Chat">
  <div class="iosDock-glass"></div>
  <div class="iosDock-highlight"></div>

  <div class="pillFace" id="composerFace">
    <div class="composerRow" id="composerRow">
      <button class="pillOpener" id="pillOpener" aria-label="Bildschirme öffnen">
        <svg viewBox="0 0 24 24"><path d="M4 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4"></path><path d="M14 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4"></path><path d="M4 15a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4"></path><path d="M14 15a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4"></path></svg>
      </button>
      <textarea id="chatInput" class="iosComposerInput" rows="1" placeholder="Schreib etwas…" autocomplete="off" spellcheck="false"></textarea>
      <button id="micBtn" aria-label="Mikrofon">
        <div class="ripple"></div>
        <div class="ripple"></div>
        <div class="ripple"></div>
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 5a3 3 0 0 1 3 -3a3 3 0 0 1 3 3v5a3 3 0 0 1 -3 3a3 3 0 0 1 -3 -3l0 -5"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M8 21l8 0"/><path d="M12 17l0 4"/>
        </svg>
      </button>
    </div>
    <div class="sceneEndRow hidden" id="sceneEndRow">
      <span class="iosSheet-label">Szene beendet</span>
      <button id="btnNextScene">Nächste Szene →</button>
    </div>
  </div>

  <div class="pillNav" id="pillNav">
    <a class="iosDock-item tabItem" href="top5k.html" data-tab="vocab" aria-label="Vocab">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M19 4v16h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h12"></path><path d="M19 16h-12a2 2 0 0 0 -2 2"></path><path d="M9 8h6"></path></svg>
    </a>
    <a class="iosDock-item tabItem" href="grammar.html" data-tab="grammar" aria-label="Grammar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l11 0"></path><path d="M9 12l11 0"></path><path d="M9 18l11 0"></path><path d="M5 6l0 .01"></path><path d="M5 12l0 .01"></path><path d="M5 18l0 .01"></path></svg>
    </a>
    <a class="iosDock-item tabItem" href="preps.html" data-tab="preps" aria-label="Präpositionen">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 17l-18 0"></path><path d="M6 10l-3 -3l3 -3"></path><path d="M3 7l18 0"></path><path d="M18 20l3 -3l-3 -3"></path></svg>
    </a>
    <a class="iosDock-item tabItem" href="ausdruck.html" data-tab="ausdruck" aria-label="Ausdruck">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4"></path><path d="M13.5 6.5l4 4"></path></svg>
    </a>
    <a class="iosDock-item active tabItem" id="chatTabItem" href="chat.html" data-tab="chat" aria-label="Chat">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9h8"></path><path d="M8 13h6"></path><path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12"></path></svg>
    </a>
  </div>
</nav>
</div>

<!-- Settings sheet -->
<div id="settingsPanel" class="menuPanel hidden">
  <div class="iosSheet-handle"></div>
  <div class="menuSection">
    <div class="iosSheet-label">Scene ends when</div>
    <div class="iosSegment">
      <button data-mode="ai">AI decides</button>
      <button data-mode="user">I decide</button>
      <button data-mode="turns">After N turns</button>
    </div>
  </div>
  <div class="menuSection">
    <div class="iosSheet-label">Turn cap</div>
    <input id="turnCapInput" type="number" inputmode="numeric" min="2" max="30" step="1">
    <p class="muted small" style="margin-top:6px;line-height:1.5;">One turn = you and the character each speaking once. Always applies as a backstop, even in the other modes.</p>
  </div>
</div>

<!-- API key overlay -->
<div id="apiKeyScreen" class="iosSetupScreen hidden">
  <div class="iosSetupCard">
    <div class="iosSetupIcon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0A84FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"></circle><path d="M10.5 12.5L20 3l2 2-2 2 2 2-3 3-2-2-3.5 3.5"></path></svg>
    </div>

    <p>Ein kostenloser Gemini API-Schlüssel wird benötigt.<br>Hol dir einen auf <strong>aistudio.google.com</strong></p>
    <input id="apiKeyInput" type="text" placeholder="AIza…" spellcheck="false" autocomplete="off"/>
    <button id="apiKeySave">Speichern &amp; weiter</button>
    <div id="apiKeyHint" class="muted small hidden" style="margin-top:10px;color:var(--bad);text-align:center;font-family:var(--font-chrome);"></div>
  </div>
</div>

<div id="errTooltip"></div>

<script>
'use strict';
const GEMINI_KEY_LS       = 'top5k_gemini_key';

/* Plain-language copy for IOSSheet.classifyError()'s categories — keeps the
   raw fetch error (status code + truncated response body) off-screen. */
const ERR_MSG_DE={
  apikey:'Der API-Schlüssel scheint ungültig zu sein',
  quota:'Anfragelimit erreicht — bitte kurz warten',
  server:'Der KI-Dienst hat gerade Probleme',
  network:'Netzwerkfehler — prüfe deine Verbindung',
  unknown:'Etwas ist schiefgelaufen'
};
const SUPABASE_URL_KEY    = 'top5k_supabase_url';
const SUPABASE_KEY_KEY    = 'top5k_supabase_key';
const SCENES_KEY          = 'chat_scenes_v1';
const SCENES_SAVED_AT_KEY = 'chat_scenes_saved_at_v1';
const SETTINGS_KEY        = 'chat_settings_v1';
const SCENES_CAP          = 40;
const CTX_TURNS           = 24;
const DEFAULT_SETTINGS    = { endMode:'ai', turnCap:8 };

const GEMINI_MODEL = 'gemini-3.5-flash-lite';
// Gemini 3.x thinking is on by default (thinkingLevel, not the old
// thinkingBudget) and those hidden reasoning tokens count against
// maxOutputTokens — pinned to "minimal" so the small budgets below go
// to the actual answer instead of being eaten by reasoning.
const GEMINI_THINKING_CONFIG = { thinkingLevel: 'minimal' };

function extractGeminiText(data) {
  const parts = data?.candidates?.[0]?.content?.parts || [];
  return parts.filter(p => !p.thought).map(p => p.text || '').join('').trim();
}

// Parses only the first complete top-level JSON object starting at the
// first "{", ignoring any trailing content after it.
function parseFirstJSON(raw) {
  const start = raw.indexOf('{');
  if (start === -1) throw new Error(`no JSON object — raw: ${raw.slice(0,120)}`);
  let depth = 0, inStr = false, esc = false;
  for (let i = start; i < raw.length; i++) {
    const c = raw[i];
    if (inStr) {
      if (esc) esc = false;
      else if (c === '\\') esc = true;
      else if (c === '"') inStr = false;
    } else {
      if (c === '"') inStr = true;
      else if (c === '{') depth++;
      else if (c === '}') { depth--; if (depth === 0) return JSON.parse(raw.slice(start, i+1)); }
    }
  }
  throw new Error(`unterminated JSON — raw: ${raw.slice(0,120)}`);
}

async function geminiRequest({ system, contents, prompt, temperature, maxOutputTokens }) {
  const key = localStorage.getItem(GEMINI_KEY_LS);
  if (!key) throw new Error('no key');
  const body = JSON.stringify({
    ...(system ? { system_instruction: { parts: [{ text: system }] } } : {}),
    contents: contents || [{ parts: [{ text: prompt }] }],
    generationConfig: { temperature, maxOutputTokens, responseMimeType: 'application/json', thinkingConfig: GEMINI_THINKING_CONFIG }
  });
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${key}`;

  const retryDelays = [800, 1600, 3200];
  let lastErr = new Error('unknown error');
  for (let attempt = 0; attempt < 3; attempt++) {
    if (attempt > 0) await new Promise(r => setTimeout(r, retryDelays[attempt-1]));
    let shouldRetry = false;
    try {
      const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body });
      if (res.status === 429 || res.status >= 500) {
        lastErr = new Error(`API ${res.status}`);
        shouldRetry = true;
      } else if (!res.ok) {
        const errBody = await res.text().catch(() => '');
        throw new Error(`API ${res.status}: ${errBody.slice(0,200)}`);
      } else {
        const data = await res.json();
        const raw = extractGeminiText(data);
        return parseFirstJSON(raw);
      }
    } catch (e) {
      lastErr = e;
      if (e instanceof TypeError) shouldRetry = true;
    }
    if (!shouldRetry) break;
  }
  throw lastErr;
}

/* ── Cloud sync (Supabase) — mirror only, app works fully offline without it ── */
function supabaseConf() {
  const url = (localStorage.getItem(SUPABASE_URL_KEY) || '').trim().replace(/\/+$/, '');
  const key = (localStorage.getItem(SUPABASE_KEY_KEY) || '').trim();
  if (!url || !key) return null;
  return { url, key };
}

async function supabaseUpsert(key, value) {
  const conf = supabaseConf();
  if (!conf) return null;
  const res = await fetch(`${conf.url}/rest/v1/kv_state`, {
    method: 'POST',
    headers: { 'apikey': conf.key, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=representation' },
    body: JSON.stringify([{ key, value, updated_at: new Date().toISOString() }])
  });
  if (!res.ok) throw new Error(`Supabase upsert ${key} failed: HTTP ${res.status}`);
  const rows = await res.json().catch(() => null);
  return (rows && rows[0]) || null;
}

async function supabaseGetRow(key) {
  const conf = supabaseConf();
  if (!conf) return null;
  const res = await fetch(`${conf.url}/rest/v1/kv_state?key=eq.${encodeURIComponent(key)}&select=value,updated_at`, {
    headers: { 'apikey': conf.key }
  });
  if (!res.ok) throw new Error(`Supabase get ${key} failed: HTTP ${res.status}`);
  const rows = await res.json();
  return (rows && rows[0]) || null;
}

let scenesPushTimer = null;
let scenesPushInFlight = false;
let scenesPushQueued = false;

function runScenesPush() {
  if (!supabaseConf()) return;
  if (scenesPushInFlight) { scenesPushQueued = true; return; }
  scenesPushInFlight = true;
  supabaseUpsert(SCENES_KEY, store)
    .then(row => {
      const ts = row && row.updated_at ? new Date(row.updated_at).getTime() : null;
      if (ts) try { localStorage.setItem(SCENES_SAVED_AT_KEY, String(ts)); } catch (e) {}
    })
    .catch(e => console.error('Cloud push failed:', e))
    .finally(() => {
      scenesPushInFlight = false;
      if (scenesPushQueued) { scenesPushQueued = false; runScenesPush(); }
    });
}
function scheduleScenesPush(delayMs) {
  if (!supabaseConf()) return;
  clearTimeout(scenesPushTimer);
  scenesPushTimer = setTimeout(runScenesPush, delayMs);
}
function pushScenesNow() {
  if (!supabaseConf()) return;
  clearTimeout(scenesPushTimer);
  runScenesPush();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pushScenesNow(); });

function fmtWhen(ts) { if (!ts) return 'never'; try { return new Date(ts).toLocaleString(); } catch { return 'never'; } }

async function tryCloudPullOnLoad() {
  if (!supabaseConf()) return false;
  try {
    const row = await supabaseGetRow(SCENES_KEY);
    if (!row || !row.value || typeof row.value !== 'object' || !Array.isArray(row.value.scenes)) return false;
    const remoteUpdatedAt = new Date(row.updated_at).getTime();
    const localSavedAt = parseInt(localStorage.getItem(SCENES_SAVED_AT_KEY) || '0', 10);
    const localEmpty = store.scenes.length === 0;
    if (!(remoteUpdatedAt > localSavedAt || localEmpty)) return false;
    const restore = await window.IOSSheet?.confirm(`Cloud copy from ${fmtWhen(remoteUpdatedAt)} is newer than this device. Restore it?`, {
      title: 'Cloud Sync', confirmLabel: 'Restore', cancelLabel: 'Keep this device'
    });
    if (restore) {
      store = { v:1, scenes: row.value.scenes };
      saveScenes();
      resumeFromStore();
      return true;
    }
    return false;
  } catch (e) {
    console.error('Cloud pull failed:', e);
    return false;
  }
}

/* ── Cast color identity ──
   Every invented character gets one consistent color for the whole scene —
   a deterministic hash of their name into a curated set of iOS system hues
   (already the palette family this app's accent/good/bad/warn colors come
   from), so a new character is visually a new character, not another flat
   blue circle. */
const CAST_HUES = ['#0A84FF','#FF375F','#FF9F0A','#64D2FF','#BF5AF2','#63E6BE'];
function castHue(name) {
  if (!name) return CAST_HUES[0];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return CAST_HUES[h % CAST_HUES.length];
}
function hexToRgba(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`;
}

function buildSystemPrompt(situation, character) {

Situation: ${situation}
Your character: ${character.name} — ${character.role}. Manner: ${character.manner}

Rules:
- Speak only in German, casual and natural, B1–B2 level, 1–3 short sentences per reply.
- Stay in character and stay inside the situation the whole time.
- Past events: Perfekt, except sein/haben/modals which stay Präteritum (war, hatte, konnte — never ist gewesen/hat gehabt). No Konjunktiv I/II. No Futur I with werden.
- Never correct the learner's German explicitly — just respond naturally in character.
- Decide whether the situation has reached a natural conclusion (goal handled, farewells exchanged, conversation wrapped up). Only set sceneComplete to true when the scene should end right after this reply.

Output ONLY JSON, no preamble, no code fences:
{"reply":"…","sceneComplete":true|false}`;
}

/* ── Scenario generation ── */
async function fetchScenario() {
  const recent = store.scenes.slice(-8).map(s => s.situation).filter(Boolean);
  const recentList = recent.length ? recent.join(' | ') : 'noch keine';

  const prompt = `You create a German role-play scenario for a B1–B2 learner to practice spoken conversation.

Invent:
- A concrete, everyday situation the learner can act out (e.g. ordering food, checking into a hotel, asking a neighbor for a favor, returning a broken item, a job interview, small talk on a train) — vary the domain each time.
- A character YOU will play opposite the learner: a first name, a one-line role/relationship, and a one-line manner/personality note.
- An opening line in German, in character, that starts the conversation naturally (a greeting or the first line of the situation).

Casual, natural spoken German, B1–B2 level. Past events use Perfekt, except sein/haben/modals which stay Präteritum (war, hatte, konnte — never ist gewesen/hat gehabt). No Konjunktiv I/II. No Futur I with werden.

Do not reuse or resemble any recent situation: ${recentList}

Output ONLY JSON, no preamble, no code fences:
{"situation":"…","character":{"name":"…","role":"…","manner":"…"},"opening":"…"}`;

  const data = await geminiRequest({ prompt, temperature:1.0, maxOutputTokens:500 });
  const situation = (data.situation || '').toString().trim();
  const character = data.character || {};
  const opening = (data.opening || '').toString().trim();
  if (!situation || !character.name || !opening) throw new Error(`bad shape — ${JSON.stringify(data).slice(0,120)}`);
  return {
    situation,
    character: { name:String(character.name).trim(), role:String(character.role||'').trim(), manner:String(character.manner||'').trim() },
    opening
  };
}

/* ── Grading ── */
async function fetchGrade(scene) {
  const charName = scene.character?.name || 'Charakter';
  const userIdxs = [];
  const lines = scene.turns.map((t, i) => {
    if (t.role === 'user') { userIdxs.push(i); return `U${userIdxs.length}: ${t.text}`; }
    return `${charName}: ${t.text}`;
  });
  if (!userIdxs.length) return {};
  const transcript = lines.join('\n');

  const prompt = `Grade a B1–B2 German learner's turns in the role-play transcript below. "${charName}" is an AI character — never grade or comment on those lines, only the learner's turns (labeled U1, U2, …).

Some learner turns were DICTATED via speech recognition — ignore capitalization and punctuation completely; never report them as errors.

For each learner turn worth flagging, return two kinds of notes:
- "corrections": a clear grammar/vocabulary error — wrong form paired with the fixed form.
- "naturalness": correct German that's non-idiomatic — acceptable but not how a native would actually say it, paired with the native phrasing.
Skip any turn with nothing to flag. Keep notes short, in English.

Casual German norms: past events use Perfekt, except sein/haben/modals which stay Präteritum (war, hatte, konnte — never ist gewesen/hat gehabt). Never flag a correct war/hatte as an error.

Output JSON only, no markdown:
{"feedback":[{"turn":1,"corrections":[{"original":"exact substring from that learner turn","correction":"fixed form","note":"short English reason"}],"naturalness":[{"original":"exact substring from that learner turn","better":"more native phrasing","note":"short English reason"}]}]}

Only include entries for turns that actually have corrections or naturalness items. Each "original" must be an exact substring of that specific learner turn's text so the app can highlight it.

Transcript:
"""
${transcript}
"""`;

  const data = await geminiRequest({ prompt, temperature:0.4, maxOutputTokens:4096 });
  if (!Array.isArray(data.feedback)) throw new Error(`bad shape — ${JSON.stringify(data).slice(0,120)}`);
  const feedback = {};
  data.feedback.forEach(item => {
    const n = Number(item && item.turn);
    if (!Number.isFinite(n) || n < 1 || n > userIdxs.length) return;
    const absIdx = userIdxs[n-1];
    const corrections = Array.isArray(item.corrections) ? item.corrections.filter(c => c && c.original) : [];
    const naturalness = Array.isArray(item.naturalness) ? item.naturalness.filter(c => c && c.original) : [];
    if (corrections.length || naturalness.length) feedback[absIdx] = { corrections, naturalness };
  });
  return feedback;
}

/* ── Highlighting & tooltip ── */
function renderSpanText(text, spans) {
  const matches = [];
  spans.forEach((sp, i) => {
    if (!sp.original) return;
    const idx = text.indexOf(sp.original);
    if (idx === -1) return;
    matches.push({ start:idx, end:idx+sp.original.length, i });
  });
  matches.sort((a,b) => a.start - b.start);
  const clean = [];
  let lastEnd = 0;
  matches.forEach(m => { if (m.start >= lastEnd) { clean.push(m); lastEnd = m.end; } });
  let html = '', pos = 0;
  clean.forEach(m => {
    html += escapeHTML(text.slice(pos, m.start));
    const sp = spans[m.i];
    // Corrections and naturalness notes are told apart by line style as well
    // as color, not color alone — see .fbLegend.
    const isCorrection = sp.type === 'correction';
    // Naturalness notes only ever land on the learner's own (accent-blue)
    // bubble, so their mark can't reuse --accent — it would vanish against
    // the bubble's own background. --warn (amber, "a soft suggestion, not
    // an error") reads clearly there and stays distinct from corrections.
    const color = isCorrection ? 'var(--bad)' : 'var(--warn)';
    const style = isCorrection ? 'solid' : 'dashed';
    html += `<span class="errSpan" style="border-bottom:2px ${style} ${color};" data-span-idx="${m.i}">${escapeHTML(text.slice(m.start, m.end))}</span>`;
    pos = m.end;
  });
  html += escapeHTML(text.slice(pos));
  return html;
}

function showSpanTooltip(span, sp) {
  const tip = document.getElementById('errTooltip');
  const isCorrection = sp.type === 'correction';
  const color = isCorrection ? 'var(--bad)' : 'var(--warn)';
  const label = isCorrection ? 'Correction' : 'More natural';
  const value = isCorrection ? sp.correction : sp.better;
  tip.style.setProperty('--tip-color', color);
  tip.innerHTML = `<div class="corrLine" style="color:${color}">${escapeHTML(label)}: ${escapeHTML(value||'')}</div><div class="muted">${escapeHTML(sp.note||'')}</div>`;
  tip.classList.remove('visible');
  tip.classList.add('show');
  const rect = span.getBoundingClientRect();
  const tipWidth = tip.offsetWidth || 260;
  const left = Math.max(8, Math.min(window.innerWidth - tipWidth - 8, rect.left));
  tip.style.left = left + 'px';
  tip.style.top = (rect.bottom + 8) + 'px';
  const arrowLeft = Math.max(14, Math.min(tipWidth-24, (rect.left + rect.width/2) - left));
  tip.style.setProperty('--tip-arrow', arrowLeft + 'px');
  requestAnimationFrame(() => tip.classList.add('visible'));
}

document.addEventListener('click', e => {
  const tip = document.getElementById('errTooltip');
  if (tip && tip.classList.contains('show') && !tip.contains(e.target) && !e.target.classList.contains('errSpan')) {
    tip.classList.remove('visible');
    setTimeout(() => tip.classList.remove('show'), 120);
  }
});

function applyFeedbackToTranscript(scene) {
  const feedback = scene.feedback || {};
  let anyMarked = false;
  messagesInner.querySelectorAll('.bubble[data-turn-index]').forEach(bub => {
    const idx = parseInt(bub.dataset.turnIndex, 10);
    const fb = feedback[idx];
    const turn = scene.turns[idx];
    if (!fb || !turn || turn.role !== 'user') return;
    const spans = [
      ...(fb.corrections || []).map(s => ({ ...s, type:'correction' })),
      ...(fb.naturalness || []).map(s => ({ ...s, type:'naturalness' }))
    ];
    if (!spans.length) return;
    anyMarked = true;
    bub.innerHTML = renderSpanText(turn.text, spans);
    bub.querySelectorAll('.errSpan').forEach(span => {
      span.addEventListener('click', e => {
        e.stopPropagation();
        const sp = spans[parseInt(span.dataset.spanIdx, 10)];
        if (sp) showSpanTooltip(span, sp);
      });
    });
  });
  // Teach the correction/naturalness convention once, the first time either
  // kind of note actually appears in this scene.
  if (anyMarked && !messagesInner.querySelector('.fbLegend')) {
    const legend = document.createElement('div');
    legend.className = 'fbLegend';
    legend.innerHTML = '<span class="fbLegend-item fbLegend-corr">Correction</span><span class="fbLegend-item fbLegend-nat">More natural</span>';
    messagesInner.appendChild(legend);
  }
}

/* ── Scene lifecycle ── */
async function startNewScene() {
  messagesInner.innerHTML = '';
  hideBothBars();
  updateHeader(null);
  showScenarioLoading();
  sceneLock = true;
  setStatus('thinking');
  try {
    const data = await fetchScenario();
    const scene = {
      date: new Date().toISOString(),
      situation: data.situation,
      character: data.character,
      turns: [{ role:'ai', text:data.opening }],
      turnCount: 0,
      ended: false,
      feedback: null
    };
    store.scenes.push(scene);
    currentScene = scene;
    saveScenes();
    scheduleScenesPush(30000);
    hideScenarioLoading();
    updateHeader(scene);
    appendTimestamp();
    await typeReply(data.opening, 0);
    sceneLock = false;
    setStatus('online');
    showInputBar();
  } catch (e) {
    console.error('[scenario]', e);
    sceneLock = false;
    setStatus('online');
    showScenarioError(e);
  }
}

async function sendMessage(text) {
  text = text.trim();
  if (!text || sceneLock || !currentScene || currentScene.ended) return;
  stopMic();
  chatInput.value = '';
  chatInput.style.height = '0px';
  chatInput.style.height = chatInput.scrollHeight + 'px';
  chatInput.classList.remove('interim', 'multiline');
  chatPillEl.classList.remove('expanded');
  micBase = '';
  appendTimestamp();
  const idx = currentScene.turns.length;
  appendBubble('user', text, idx);
  currentScene.turns.push({ role:'user', text });
  saveScenes();
  await fetchAIReply();
}

async function fetchAIReply() {
  sceneLock = true;
  setStatus('thinking');
  try {
    const sys = buildSystemPrompt(currentScene.situation, currentScene.character);
    const contents = buildContents(currentScene.turns);
    const data = await geminiRequest({ system:sys, contents, temperature:1.05, maxOutputTokens:300 });
    const reply = (data.reply || '').toString().trim();
    if (!reply) throw new Error('empty reply');
    const sceneComplete = data.sceneComplete === true;
    if (currentScene.ended) return; // scene was manually ended while this was in flight
    const turnIndex = currentScene.turns.length;
    currentScene.turns.push({ role:'ai', text:reply });
    currentScene.turnCount = (currentScene.turnCount || 0) + 1;
    saveScenes();
    scheduleScenesPush(30000);
    appendTimestamp();
    await typeReply(reply, turnIndex);
    checkSceneEnd(sceneComplete);
  } catch (e) {
    console.error('[scene reply]', e);
    sceneLock = false;
    setStatus('online');
    appendTimestamp();
    appendBubble('ai', 'Ups, das hat leider nicht geklappt. Versuch es nochmal!');
  }
}

function checkSceneEnd(sceneComplete) {
  const settings = loadSettings();
  const capReached = (currentScene.turnCount || 0) >= settings.turnCap;
  const aiWantsEnd = settings.endMode === 'ai' && sceneComplete;
  sceneLock = false;
  setStatus('online');
  if (capReached || aiWantsEnd) endScene();
}

async function endScene() {
  if (!currentScene || currentScene.ended) return;
  stopMic();
  currentScene.ended = true;
  saveScenes();
  updateHeader(currentScene);
  hideBothBars();
  showGradingIndicator();
  await gradeCurrentScene();
}

async function gradeCurrentScene() {
  try {
    const feedback = await fetchGrade(currentScene);
    currentScene.feedback = feedback;
    saveScenes();
    pushScenesNow();
    hideGradingIndicator();
    applyFeedbackToTranscript(currentScene);
    showNextSceneAffordance();
  } catch (e) {
    console.error('[scene grade]', e);
    showGradingError(e);
  }
}

/* ── Type AI reply word by word ── */
async function typeReply(text, turnIndex) {
  setStatus('speaking');
  const words = text.split(' ');
  const hue = castHue(currentScene?.character?.name);

  const row = document.createElement('div');
  row.className = 'bRow ai';
  const av = document.createElement('div');
  av.className = 'bAvatar';
  av.style.background = hexToRgba(hue, 0.22);
  av.style.color = hue;
  av.textContent = (currentScene?.character?.name?.[0] || '?').toUpperCase();
  row.appendChild(av);
  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.dataset.turnIndex = String(turnIndex);
  bub.style.borderLeftColor = hue;
  row.appendChild(bub);
  messagesInner.appendChild(row);

  await new Promise(r => setTimeout(r, 300));
  speakText(text);

  for (let i = 0; i < words.length; i++) {
    bub.textContent += (i > 0 ? ' ' : '') + words[i];
    scrollBottom();
    await pause(150);
  }
}

function pause(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ── TTS ── */
let deVoice = null;
{
  const loadVoices = () => {
    const v = window.speechSynthesis?.getVoices().find(v => v.lang.startsWith('de'));
    if (v) deVoice = v;
  };
  loadVoices();
  window.speechSynthesis?.addEventListener('voiceschanged', loadVoices);
}

document.addEventListener('pointerdown', () => unlockSynth(), { once: true });
let synthUnlocked = false;
function unlockSynth() {
  if (synthUnlocked || !window.speechSynthesis) return;
  synthUnlocked = true;
  const u = new SpeechSynthesisUtterance('okay');
  u.volume = 0;
  u.rate = 10;
  window.speechSynthesis.speak(u);
}

function speakText(text) {
  const synth = window.speechSynthesis;
  if (!synth) return;
  synth.cancel();
  setTimeout(() => {
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = 'de-DE';
    utt.rate = 0.93;
    if (deVoice) utt.voice = deVoice;
    synth.speak(utt);
  }, 50);
}

/* ── Speech recognition ── */
let recognition = null;
let micActive = false;
let micBase = '';

{
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    recognition = new SR();
    recognition.lang = 'de-DE';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      micBase = chatInput.value.trimEnd();
      setStatus('listening');
    };

    recognition.onresult = e => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      const sep = w => w && !w.endsWith(' ') ? ' ' : '';
      if (final) {
        micBase = (micBase + sep(micBase) + final).trimStart();
        chatInput.value = micBase;
        chatInput.classList.remove('interim');
      } else if (interim) {
        chatInput.value = micBase + sep(micBase) + interim;
        chatInput.classList.add('interim');
      }
      chatInput.style.height = '0px';
      chatInput.style.height = chatInput.scrollHeight + 'px';
    };

    recognition.onerror = e => { if (e.error !== 'aborted') console.warn('[mic]', e.error); };

    recognition.onend = () => {
      micBtn.classList.remove('listening');
      micActive = false;
      chatInput.classList.remove('interim');
      if (!sceneLock) setStatus('online');
    };
  } else {
    micBtn.classList.add('hidden');
  }
}

function stopMic() {
  if (!micActive || !recognition) return;
  try { recognition.stop(); } catch {}
  micBtn.classList.remove('listening');
  micActive = false;
  chatInput.classList.remove('interim');
}

/* ── The morphing pill: composer <-> nav, + keyboard ride ──
   Two springs, one pill.

   (1) MORPH spring — a single 0..1 channel `m`. m=0 is the composer face,
   m=1 is the 5-tab dock. render() paints both faces off that one value so
   they cross-dissolve as one thing: the composer fades and its field
   collapses toward the opener (transform-origin:left), while the nav tabs
   cascade in left-to-right (each tab's local progress is offset by its
   index, so they chase one another out of the opener instead of appearing
   together). The opener glyph just fades under the incoming Vocab tab —
   grid becomes book.

   (2) KEYBOARD spring — translates the whole pill up to ride the keyboard.
   Because the composer IS the pill, there's no second floating bar to
   collide with the keyboard; the dock simply can't be open while typing
   (we snap the morph shut if it somehow is).

   IOSMotion loads via a deferred <script> (runs after parse); this file's
   <script> is not deferred, so IOSMotion isn't defined during parse.
   setupPill() is only called from DOMContentLoaded, by which point it is. */
let morphSpring = null, kbOpen = false, navOpen = false;
function clamp01(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }
function renderMorph(m) {
  composerFaceEl.style.opacity = clamp01(1 - m * 1.6);
  composerFaceEl.style.pointerEvents = m < 0.4 ? 'auto' : 'none';
  chatInput.style.transform = 'scaleX(' + (1 - 0.85 * m).toFixed(3) + ')';
  micBtn.style.transform = 'scale(' + (1 - 0.3 * m).toFixed(3) + ')';
  navItemsEls.forEach((el, i) => {
    const local = clamp01((m - i * 0.11) / 0.55);
    el.style.opacity = local.toFixed(3);
    el.style.transform = 'translateX(' + ((1 - local) * -14).toFixed(1) + 'px)';
  });
  pillNavEl.style.pointerEvents = m > 0.6 ? 'auto' : 'none';
}
function openNav()  { if (kbOpen) return; navOpen = true;  chatPillEl.classList.add('navmode');    morphSpring.to({ m: 1 }); }
function closeNav() { navOpen = false; chatPillEl.classList.remove('navmode'); morphSpring.to({ m: 0 }); }

function setupPill() {
  morphSpring = IOSMotion.createSpring({ m: 0 }, { damping: 1, response: 0.4 });
  morphSpring.onUpdate(v => renderMorph(v.m));
  renderMorph(0);

  const kbSpring = IOSMotion.createSpring({ y: 0 }, { damping: 1, response: 0.3 });
  kbSpring.onUpdate(v => {
    chatPillEl.style.transform = v.y > 0.5 ? ('translateY(' + (-v.y).toFixed(1) + 'px)') : '';
  });

  document.getElementById('pillOpener').addEventListener('click', openNav);
  // The active Chat tab doesn't navigate — it returns you to the composer.
  document.getElementById('chatTabItem').addEventListener('click', e => { e.preventDefault(); closeNav(); });

  const vv = window.visualViewport;
  if (vv) {
    const update = () => {
      const inset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      kbOpen = inset > 120;
      document.body.classList.toggle('kb-open', kbOpen);
      if (kbOpen && navOpen) closeNav();      // can't browse tabs mid-type
      kbSpring.to({ y: kbOpen ? (inset - 4) : 0 });
      updateMsgBottomPad();
    };
    vv.addEventListener('resize', update);
    vv.addEventListener('scroll', update);
  }
}

/* ── Button wiring helper (pointerdown+mousedown, 400ms throttle) ── */
function wireButton(id, handler) {
  const el = document.getElementById(id);
  if (!el) return;
  let lock = 0;
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    const now = Date.now(); if (now - lock < 400) return; lock = now;
    handler();
  }, { passive:false });
  el.addEventListener('mousedown', e => e.preventDefault());
}

/* ── Wire input/mic ── */
{
  let lockMic = 0;
  micBtn.addEventListener('pointerdown', e => {
    e.preventDefault();
    const now = Date.now(); if (now - lockMic < 400) return; lockMic = now;
    unlockSynth();
    if (!recognition) return;
    if (micActive) {
      stopMic();
      const t = chatInput.value.trim();
      if (t) sendMessage(t);
    } else {
      micActive = true;
      micBtn.classList.add('listening');
      try { recognition.start(); } catch {}
    }
  }, { passive:false });
  micBtn.addEventListener('mousedown', e => e.preventDefault());

  function resizeInput() {
    chatInput.style.height = '0px';
    const sh = chatInput.scrollHeight;
    chatInput.style.height = sh + 'px';
    // One line → pill; wrapped → rounded rectangle (see .iosComposerInput
    // in ios-theme.css). Threshold derived from the field's own line-height
    // + vertical padding (robust across fonts) rather than a magic number:
    // multiline once the content passes ~1.5 lines. The pill shell flattens
    // in lockstep so field + capsule share one shape.
    const cs = getComputedStyle(chatInput);
    const lh = parseFloat(cs.lineHeight) || 21;
    const padV = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    const multi = sh > lh * 1.5 + padV;
    chatInput.classList.toggle('multiline', multi);
    chatPillEl.classList.toggle('expanded', multi);
  }
  chatInput.addEventListener('input', resizeInput);

  chatInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      unlockSynth();
      const t = chatInput.value.trim();
      if (t) sendMessage(t);
    }
  });
}

/* ── Settings sheet wiring ── */
function applySettingsUI(s) {
  document.querySelectorAll('#settingsPanel .iosSegment button').forEach(b => b.classList.toggle('active', b.dataset.mode === s.endMode));
  document.getElementById('turnCapInput').value = s.turnCap;
}
document.querySelectorAll('#settingsPanel .iosSegment button').forEach(b => {
  b.addEventListener('click', () => {
    const s = loadSettings();
    s.endMode = b.dataset.mode;
    saveSettings(s);
    applySettingsUI(s);
  });
});
document.getElementById('turnCapInput').addEventListener('change', e => {
  const s = loadSettings();
  let v = parseInt(e.target.value, 10);
  if (!Number.isFinite(v)) v = DEFAULT_SETTINGS.turnCap;
  v = Math.max(2, Math.min(30, v));
  s.turnCap = v;
  saveSettings(s);
  e.target.value = v;
});
wireButton('btnSettings', () => { applySettingsUI(loadSettings()); window.IOSSheet?.open('settingsPanel'); });
wireButton('btnEndScene', () => { if (currentScene && !currentScene.ended) endScene(); });
wireButton('btnNextScene', () => startNewScene());

/* ── Tab persistence ── */
document.querySelectorAll('.tabItem[data-tab]').forEach(a => {
  a.addEventListener('click', () => localStorage.setItem('top5k_active_tab', a.dataset.tab));
});

/* ── API key screen ── */
wireButton('apiKeySave', () => {
  const val = (document.getElementById('apiKeyInput').value || '').trim();
  const hint = document.getElementById('apiKeyHint');
  if (!val) { hint.textContent = 'Bitte API-Schlüssel eingeben.'; hint.classList.remove('hidden'); return; }
  localStorage.setItem(GEMINI_KEY_LS, val);
  location.reload();
});
document.getElementById('apiKeyInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('apiKeySave').dispatchEvent(new PointerEvent('pointerdown', { bubbles:true }));
});

/* ── Boot ── */
function resumeFromStore() {
  const last = store.scenes[store.scenes.length - 1];
  if (!last) { startNewScene(); return; }
  currentScene = last;
  updateHeader(last);
  renderScene(last);
  if (last.ended) {
    if (!last.feedback) {
      hideBothBars();
      showGradingIndicator();
      gradeCurrentScene();
    }
  } else {
    const settings = loadSettings();
    if ((last.turnCount || 0) >= settings.turnCap) endScene();
  }
}

async function boot() {
  if (!localStorage.getItem(GEMINI_KEY_LS)) {
    document.getElementById('apiKeyScreen').classList.remove('hidden');
    return;
  }
  if (store.scenes.length === 0) {
    const restored = await tryCloudPullOnLoad();
    if (!restored) startNewScene();
  } else {
    resumeFromStore();
    tryCloudPullOnLoad();
  }
}

document.addEventListener('DOMContentLoaded', () => { setupPill(); boot(); });
</script>
